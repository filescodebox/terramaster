name: CI
# 推送/PR:compose 模板校验 + TOS7 骨架 lint + 部署包 zip 组装断言
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: compose 模板校验
        run: docker compose -f deploy/compose.yml config -q
      - name: TOS7 config.ini 可解析 + 关键字段
        run: |
          python3 - <<'EOF'
          import json
          cfg = json.load(open('tos7/config.ini'))
          assert cfg['id'] == 'pigeonbox'
          assert cfg['application_type'] == 'docker'
          assert cfg['depend'] == ['DockerEngine']
          print('config.ini OK')
          EOF
      - name: TOS7 应用包合规校验(官方 Chapter 9 规则)
        # TOS 7 应用商店的校验规则只存在于官方开发指南里(散在章节正文、官方模板
        # 注释清单、模板 README 三处,且彼此不完全一致)⇒ 靠人记必然漂移。
        # 本脚本把能定论的规则逐条变成机器判据:红灯=违反平台硬规则(送审必被打回),
        # 黄灯=送审前置未就绪(镜像源待 Docker Hub 决策,不由本仓单方面决定)。
        run: python3 scripts/check_tos7_package.py
      - name: TOS7 校验器判据自测(每条规则都要能判红)
        # 防止校验器退化成"什么都报绿"——那比没有校验器更危险。
        # 逐条注入违规(latest/privileged/host 网络/Volume 通配/序列内注释/
        # 缺 user/缺 healthcheck/x-app-meta 位置/字段漂移/lang 少语言/CRLF/
        # 禁用端口/具名卷未声明/…)⇒ 断言每次都红且报出对应原因。
        run: python3 scripts/check_tos7_package_test.py
      - name: TOS7 compose 语法校验
        run: docker compose -f tos7/docker-compose.yml config -q
      - name: 共享资产与 hub 模板对齐(漂移门禁)
        # 模板真相源=hub 仓 deploy/nas/。列车 bump PR 窗口:读 hub 同列车分支模板
        # (消灭「物化已新版、模板仍旧版」的合并时序窗,1.20.0 首航实测);脚本与模板
        # 一律 gh api 实时读(raw CDN ~5min 缓存=幽灵模板)。push 事件 head_ref 空→main。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=main
          # 分支名来源**两种事件都要覆盖**（2026-10-24 实录，3.3.23 列车卡死实录）：
          #   · pull_request：github.head_ref = 源分支名（PR 场景）
          #   · push       ：github.head_ref **为空**，但 github.ref = refs/heads/<分支>
          # 此前只认 head_ref ⇒ push 事件（列车分支推送时触发）恒取 main ⇒ 期望侧读
          # **上一车**的 hub 模板，而实际侧读**本车**已物化的内容 ⇒ **必假漂移**
          # ⇒ 三个 NAS 物化 PR 全红 ⇒ auto-merge 被阻断 ⇒ 整条列车卡在 draft。
          case "${{ github.head_ref }}" in train/*) REF="${{ github.head_ref }}";; esac
          if [ "$REF" = main ]; then
            case "${{ github.ref }}" in refs/heads/train/*) REF="${{ github.ref_name }}";; esac
          fi
          # 期望侧再定位一次：**按本仓 VERSION 找 hub 的同名 tag / 列车分支**。
          # 2026-10-26 实录（4.0.2 列车）：上面的 head_ref/ref_name 只在「列车分支」
          # 事件里取到 train/*；**列车 PR 合进本仓 main 之后**的 push 事件 ⇒
          # 期望侧回落到 hub 的 main —— 而 hub 的列车 PR 此刻**还没合** ⇒ 期望侧是
          # **上一车**的模板（4.0.1），实际侧已是本车（4.0.2）⇒ **必假漂移**
          # ⇒ 三个 NAS 仓在 main 上 CI 红（drift gate 报 2 处漂移）。
          # ⇒ 期望侧改为逐个探测：hub 的 tag v<VERSION>（列车已发版 ⇒ 不可变、最准）
          #   → hub 的 train/<VERSION> 分支（列车窗口内）→ main（兜底）。
          VER="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ -n "$VER" ] && [ "$REF" = main ]; then
            for cand in "v${VER}" "train/${VER}"; do
              if gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=${cand}" --jq .content >/dev/null 2>&1; then
                REF="$cand"; break
              fi
            done
          fi
          gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=$REF" --jq .content | base64 -d > /tmp/nas-sync.sh
          PB_NAS_TEMPLATE_REF="$REF" bash /tmp/nas-sync.sh check --platform terramaster --dir .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 组装部署包 zip(CI 版本 0.0.0)
        run: ./scripts/build-zip.sh 0.0.0
      - name: 组装 TOS 7 官方应用包(4 文件 tar.gz)
        # 打包前先过合规校验(红灯即停)⇒ 不会产出「明知违规还打出来」的包。
        # ⚠️ 送审包本体仍受一个外部条件约束：TOS 商店只收 Docker Hub 镜像，
        #    而 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN 未配 ⇒ Docker Hub 上还没有
        #    这些镜像 ⇒ 送审前须先让镜像发布出去（见 tos7/README.md）。
        run: ./scripts/build-tos7-package.sh pigeonbox x86_64
      - name: TOS 7 包结构断言(标准读取器口径)
        # ⚠️ **不能用 `tar -tzf`**：macOS 的 bsdtar 会**隐藏** AppleDouble `._*`
        #    条目 ⇒ 用它断言「包内恰好 4 个文件」**恰好瞎在这一点上**。
        #    2026-10-31 实测：macOS 上打出来的包实际含 8 个条目（4 个 `._*` 垃圾），
        #    bsdtar 只显示 4 个 ⇒ 脚本自检与 CI 断言**双双放行**，
        #    而 TOS 只收恰好 4 个文件 ⇒ 送审必被打回。
        #    ⇒ 断言一律用**标准读取器**（python tarfile）——与平台解包视角一致。
        run: |
          python3 - <<'EOF'
          import json
          import tarfile
          p = "dist/pigeonbox-x86_64.tar.gz"
          with tarfile.open(p) as t:
              names = t.getnames()
          assert len(names) == 4, f"包内应恰好 4 个文件，实际 {len(names)}：{names}"
          junk = [n for n in names if n.startswith("._") or "/._" in n]
          assert not junk, f"混入 AppleDouble 垃圾条目：{junk}"
          with tarfile.open(p) as t:
              cfg = json.loads(t.extractfile("config.ini").read().decode())
          assert cfg["platform"] == "x86_64", f"包内 platform={cfg['platform']}"
          print("✓ 包内恰好 4 个文件、无垃圾条目、platform=x86_64")
          EOF
      - name: TOS 7 打包脚本自测(平台必须真写进包里)
        # 2026-10-31 实测的真缺陷：platform 参数此前只进文件名、不进包内容
        # ⇒ 打出「名字叫 aarch64、内容是 x86_64」的包 ⇒ 送审必被拒。
        run: python3 scripts/build_tos7_package_test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tos7-package
          path: dist/pigeonbox-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: 结构断言
        run: |
          unzip -l dist/pigeonbox-terramaster-0.0.0.zip | grep -q compose.yml
          unzip -l dist/pigeonbox-terramaster-0.0.0.zip | grep -q env.example
          unzip -l dist/pigeonbox-terramaster-0.0.0.zip | grep -q 安装指引.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-kit
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
